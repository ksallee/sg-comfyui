# Comfy Registry metadata, read by `comfy node publish`. ComfyUI itself reads only __init__.py.
# Names come from DESIGN.md, "Names" — `[project].name` is immutable on the Registry once claimed.

[project]
name = "sg-comfyui"
description = "Publish ComfyUI generations to Flow Production Tracking as Versions, with their provenance."
readme = "README.md"
requires-python = ">=3.11"
# 0.1.0 because nothing has been published yet: this is a starting point, not a release. The Registry
# rejects a re-publish of a version it already has, so bump it in the same commit that publishes.
version = "0.1.0"
# Half the audience still searches "shotgrid", and the Registry searches keywords (DESIGN: Names).
keywords = ["sg", "flow production tracking", "shotgrid", "shotgun", "vfx", "provenance", "version", "pipeline"]
license = "MIT"
license-files = ["LICENSE"]
# sg-groundtruth is the corpus repo's client half, on PyPI since 0.1.1 (DESIGN: "The dependency
# problem"). It pulls `requests` itself; `requests` and `Pillow` are named anyway because ComfyUI
# ships both and a Registry install must not depend on that staying true.
dependencies = ["sg-groundtruth>=0.1.1", "requests", "Pillow"]

[project.urls]
Repository = "https://github.com/ksallee/sg-comfyui"

[tool.comfy]
DisplayName = "Flow Production Tracking"
# The publisher's own Registry handle, and an icon URL. Both are per-publisher, not per-repo, so they
# are left empty rather than guessed; `comfy node publish` will not accept an empty PublisherId.
PublisherId = ""
Icon = ""

# MIT, because a studio's legal review of a node pack should take no time and the repo is meant to be
# forked. Nothing is vendored from ComfyUI's GPL-3.0 frontend, which is the constraint that would
# have forced otherwise.
