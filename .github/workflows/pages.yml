name: pages

# Builds site/ and pushes the result to the gh-pages branch. Nothing is public until GitHub Pages is
# pointed at that branch, which is a repository setting.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: The page copies four blocks out of README.md
        run: node site/scripts/check-readme-blocks.mjs

      - name: Build
        working-directory: site
        env:
          # A project site is served under /<repo>. Set this to / for a custom domain.
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build
          touch build/.nojekyll

      - name: Push to gh-pages
        run: |
          cd site/build
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
